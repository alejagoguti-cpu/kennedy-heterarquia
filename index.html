<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a09" />
<title>Kennedy · heterarquía y gobernanza policéntrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;650;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app">
  <header class="top">
    <b class="logo">Kennedy · Heterarquía</b>
    <nav class="pills" id="pills"></nav>
    <div class="clock"><button id="timer" title="Cronómetro (T)">00:00–01:20</button><i class="bar"><u id="bar"></u></i></div>
  </header>
  <section class="titleblock">
    <div class="kicker" id="kicker"></div>
    <h1 id="h1"></h1>
    <p id="lead"></p>
  </section>
  <section class="stagecard" id="stagecard">
    <div class="chips">
      <button id="cGuion">Guion</button>
      <button id="cReset">Reiniciar pasos</button>
      <button id="cFull">Pantalla completa</button>
    </div>
    <div class="hint" id="hint">Clic o → para avanzar un paso</div>
    <div class="stage" id="stage"></div>
    <aside class="guion" id="guion"><button class="x" id="gx" aria-label="Cerrar">×</button><div id="gbody"></div></aside>
    <div class="cont" id="cont"><span class="dots" id="dots"></span><span id="contT"></span></div>
  </section>
  <footer class="foot">
    <span class="src" id="src"></span>
    <div class="scrub" id="scrub"></div>
    <div class="nav"><button id="prev">Anterior</button><button id="next" class="pri">Siguiente</button></div>
  </footer>
</div>
<script src="./slides.js"></script>
<script src="./layers.js"></script>
<script src="./app.js"></script>
</body>
</html>
